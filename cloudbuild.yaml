steps:
  # Krok 1: Zbuduj obraz
  #
  # Danych nie budujemy tutaj. wcag-data.json i embeddings/search.db są
  # commitowane, a build_data.py wymaga katalogu wcag-repo/ (poza repozytorium)
  # oraz pandoca — wcześniejszy krok "pip install && python3 build_data.py"
  # nie mógł się powieść i wywracał cały pipeline.
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args:
      - 'build'
      - '-t'
      - 'europe-central2-docker.pkg.dev/$PROJECT_ID/wcag22/wcag22-mcp:latest'
      - '-t'
      - 'europe-central2-docker.pkg.dev/$PROJECT_ID/wcag22/wcag22-mcp:$BUILD_ID'
      - '.'

  # Krok 2: Sprawdź, czy obraz naprawdę działa
  #
  # Uruchamiamy smoke test wewnątrz zbudowanego obrazu, więc weryfikujemy
  # dokładnie to, co pojedzie na produkcję: obecność networkx, indeksu FTS5
  # i poprawne odpowiedzi wszystkich narzędzi. Brakująca zależność albo
  # nieskopiowany plik zatrzymują pipeline tutaj, a nie po wdrożeniu.
  - name: 'gcr.io/cloud-builders/docker'
    id: smoke-test
    args:
      - 'run'
      - '--rm'
      - '--entrypoint'
      - 'python3'
      - 'europe-central2-docker.pkg.dev/$PROJECT_ID/wcag22/wcag22-mcp:$BUILD_ID'
      - 'smoke_test.py'

  # Krok 3: Push do Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: push
    args:
      - 'push'
      - '--all-tags'
      - 'europe-central2-docker.pkg.dev/$PROJECT_ID/wcag22/wcag22-mcp'

  # Krok 4: Deploy na Cloud Run
  #
  # Serwer działa bezstanowo (stateless_http), więc session affinity nie jest
  # potrzebne, a współbieżność może być wysoka — dane są w pamięci, tylko do
  # odczytu, bez I/O na żądanie.
  - name: 'gcr.io/cloud-builders/gcloud'
    id: deploy
    args:
      - 'run'
      - 'deploy'
      - 'wcag22-mcp'
      - '--image=europe-central2-docker.pkg.dev/$PROJECT_ID/wcag22/wcag22-mcp:$BUILD_ID'
      - '--region=europe-central2'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--cpu-boost'
      - '--timeout=600'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--concurrency=80'
      - '--port=8080'
      # Wymaga jednorazowego utworzenia sekretu:
      #   printf '%s' "TWÓJ-KLUCZ" | gcloud secrets create wcag22-api-key --data-file=-
      #   gcloud secrets add-iam-policy-binding wcag22-api-key \
      #     --member=serviceAccount:$PROJECT_NUMBER-compute@developer.gserviceaccount.com \
      #     --role=roles/secretmanager.secretAccessor
      # Bez sekretu ten krok się nie powiedzie — usuń wtedy poniższą linię,
      # ale pamiętaj, że serwer bez klucza jest otwarty dla wszystkich.
      - '--set-secrets=WCAG22_API_KEY=wcag22-api-key:latest'

images:
  - 'europe-central2-docker.pkg.dev/$PROJECT_ID/wcag22/wcag22-mcp'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '900s'
